<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ispahani Ideal School — CMS Admin Panel</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0D13;
      color: #F3F4F6;
      margin: 0;
      padding: 0;
    }
    /* Brand styling for Decap CMS loader */
    .nc-app-header {
      background-color: #8f0d1d !important;
    }
  </style>
  <!-- Netlify Identity Widget for Authentication -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS Core SPA -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
      window.netlifyIdentity.init();
    }

    // Enforce explicit confirmation dialog before any item deletion in CMS
    document.addEventListener('click', function(e) {
      const target = e.target.closest('button, a, [role="button"]');
      if (!target) return;
      const text = (target.innerText || target.textContent || '').trim().toLowerCase();
      const className = (typeof target.className === 'string' ? target.className : '').toLowerCase();
      if (text.includes('delete') || className.includes('delete')) {
        if (!window.confirm("Are you sure you want to delete this item?")) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          return false;
        }
      }
    }, true);
  </script>
</body>
</html>
